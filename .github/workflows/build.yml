name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # Cache Spigot BuildTools so it doesn't re-run on every push
      - name: Cache Spigot 1.8.8
        id: cache-spigot
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc/spigot-api
          key: spigot-1.8.8-${{ runner.os }}

      - name: Build Spigot 1.8.8 (first run only)
        if: steps.cache-spigot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/buildtools
          cd /tmp/buildtools
          curl -o BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 1.8.8 --compile craftbukkit
        # The jar is installed into ~/.m2 by BuildTools automatically

      - name: Build with Maven
        run: mvn -B clean package --no-transfer-progress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROF_PlayerVault-${{ github.sha }}
          path: target/ROF_PlayerVault-*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only run on version tags (v1.0.0, v2.0.0, etc.)
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Restore Spigot cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc/spigot-api
          key: spigot-1.8.8-${{ runner.os }}

      - name: Build with Maven
        run: mvn -B clean package --no-transfer-progress

      - name: Get version tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          name: ROF_PlayerVault ${{ steps.tag.outputs.VERSION }}
          body: |
            ## ROF_PlayerVault ${{ steps.tag.outputs.VERSION }}

            ### Installation
            1. Drop `ROF_PlayerVault-*.jar` into your `/plugins/` folder.
            2. Restart your server.
            3. Edit `plugins/ROF_PlayerVault/config.yml` to your liking.

            ### Compatibility
            - Minecraft: **1.8.8 – 1.21+**
            - Optional: Vault (economy), PlaceholderAPI

            > Full changelog in [CHANGELOG.md](CHANGELOG.md)
          files: target/ROF_PlayerVault-*.jar
          draft: false
          prerelease: false
